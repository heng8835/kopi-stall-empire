<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprite Preview</title>
    <!-- Dev-only page (npm run dev -> /sprites.html). Not part of the itch.io build. -->
    <style>
      body { margin: 0; padding: 16px; background: #bfe6f5; font: 13px system-ui, sans-serif; color: #3a2e2a; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      #grid { display: flex; flex-wrap: wrap; gap: 16px; }
      figure { margin: 0; text-align: center; }
      canvas { image-rendering: pixelated; background: #f3e3c3; border-radius: 4px; display: block; }
      .warn { color: #c0392b; font-size: 11px; max-width: 120px; }
    </style>
  </head>
  <body>
    <h1>Sprites (src/data/sprites.js), 8x scale</h1>
    <div id="grid"></div>
    <script type="module" src="/src/dev/spritePreview.js"></script>
  </body>
</html>
